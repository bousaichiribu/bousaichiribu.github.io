<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません｜防災地理部</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="main-content">
    <article class="prose">
      <h1>ページが見つかりません</h1>
      <p><a class="text-link" href="/">ホームへ戻る →</a></p>
    </article>
  </main>
  <script>
    const path = window.location.pathname.replace(/\/+$/, "");
    const activity = path.match(/\/activities\/(\d{4})(?:\/(class|tour))?$/);
    if (activity) {
      const section = activity[2] ? `&section=${activity[2]}` : "";
      window.location.replace(`/activity.html?year=${activity[1]}${section}`);
    } else if (path === "/activities") {
      window.location.replace("/activities.html");
    } else if (path === "/contact" || path === "/contact.html") {
      window.location.replace("/#contact");
    }
  </script>
</body>
</html>
